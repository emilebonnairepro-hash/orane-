<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#FFF3E3;display:grid;place-items:center;height:100vh}
.scene{position:relative;width:420px;height:700px}
.spray{position:absolute;left:50%;top:40px;width:70px;height:90px;transform:translateX(-50%);background:#f4f4f4;border:3px solid #2A1240;border-radius:16px 16px 6px 6px}
.buse{position:absolute;left:calc(50% - 50px);top:62px;width:24px;height:16px;background:#2A1240;border-radius:4px}
.flacon{position:absolute;left:50%;top:128px;width:200px;height:520px;transform:translateX(-50%);background:linear-gradient(90deg,#e9e9e9,#fff 40%,#dcdcdc);border:3px solid #2A1240;border-radius:22px;overflow:hidden;box-shadow:12px 12px 0 #2A1240}
.etiq{position:absolute;left:0;right:0;top:120px;height:300px;background-image:url(sortie/18-shampooing-sec/etiquette.png);background-size:auto 300px;background-position:var(--x) 0}
.reflet{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.16),rgba(255,255,255,0) 30%,rgba(255,255,255,.3) 55%,rgba(0,0,0,.18))}
</style></head><body><div class="scene"><div class="buse"></div><div class="spray"></div><div class="flacon"><div class="etiq"></div><div class="reflet"></div></div></div>
<script>const h=300,w=h*2508/2220,cx=27.6/106.19*w;document.querySelector('.etiq').style.setProperty('--x',(100-cx)+'px');</script></body></html>
