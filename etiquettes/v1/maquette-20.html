<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#FFF3E3;display:grid;place-items:center;height:100vh}
.scene{position:relative;width:520px;height:720px}
.sachet{position:absolute;left:50%;top:40px;width:420px;height:620px;transform:translateX(-50%) rotate(-3deg);background:linear-gradient(120deg,#f2f2f2,#fff 40%,#e4e4e4);border:3px solid #2A1240;border-radius:22px 90px 22px 22px;box-shadow:12px 12px 0 #2A1240;overflow:hidden}
.soudure{position:absolute;inset:14px;border:2px dashed rgba(42,18,64,.18);border-radius:14px 80px 14px 14px}
.etiq{position:absolute;left:50%;top:44px;width:360px;height:541px;transform:translateX(-50%);background:url(sortie/20-patchs-yeux-cafeine/etiquette.png) center/100% 100% no-repeat;border-radius:6px 64px 6px 6px}
.reflet{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.28) 45%,rgba(255,255,255,0) 60%)}
</style></head><body><div class="scene"><div class="sachet"><div class="soudure"></div><div class="etiq"></div><div class="reflet"></div></div></div></body></html>
