<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#FFF3E3;display:grid;place-items:center;height:100vh}
.scene{position:relative;width:520px;height:720px}
.bouchon{position:absolute;left:50%;top:40px;width:150px;height:90px;transform:translateX(-50%);background:linear-gradient(90deg,#ececec,#fff 45%,#dedede);border:3px solid #2A1240;border-radius:16px 16px 6px 6px}
.flacon{position:absolute;left:50%;top:126px;width:290px;height:560px;transform:translateX(-50%);background:linear-gradient(180deg,rgba(255,255,255,.55) 0 6%,#F6D9A0 6% 34%,#e9f3f6 34% 100%);border:3px solid #2A1240;border-radius:40px 40px 26px 26px;overflow:hidden;box-shadow:12px 12px 0 #2A1240}
.etiq{position:absolute;left:0;right:0;top:120px;height:400px;background-image:url(sortie/19-demaquillant-biphase/etiquette.png);background-size:auto 400px;background-position:var(--x) 0}
.reflet{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.12),rgba(255,255,255,0) 30%,rgba(255,255,255,.35) 55%,rgba(0,0,0,.14))}
</style></head><body><div class="scene"><div class="bouchon"></div><div class="flacon"><div class="etiq"></div><div class="reflet"></div></div></div>
<script>const h=400,w=h*2339/1748,cx=25.7/99*w;document.querySelector('.etiq').style.setProperty('--x',(145-cx)+'px');</script></body></html>
