<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#FFF3E3;display:grid;place-items:center;height:100vh}
.scene{position:relative;width:420px;height:700px}
.pompe{position:absolute;left:50%;top:40px;width:56px;height:110px;transform:translateX(-50%);background:#f4f4f4;border:3px solid #2A1240;border-radius:12px 12px 4px 4px}
.col{position:absolute;left:50%;top:146px;width:110px;height:40px;transform:translateX(-50%);background:#e9e9e9;border:3px solid #2A1240;border-radius:6px}
.flacon{position:absolute;left:50%;top:182px;width:230px;height:470px;transform:translateX(-50%);background:linear-gradient(90deg,#e9eef2,#fbfdff 40%,#dfe6ec);border:3px solid #2A1240;border-radius:26px;overflow:hidden;box-shadow:12px 12px 0 #2A1240}
.etiq{position:absolute;left:0;right:0;top:150px;height:190px;background-image:url(sortie/11-gel-double-hydratation/etiquette.png);background-size:auto 190px;background-position:var(--x) 0}
.reflet{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.15),rgba(255,255,255,0) 30%,rgba(255,255,255,.3) 55%,rgba(0,0,0,.18))}
</style></head><body><div class="scene"><div class="pompe"></div><div class="col"></div><div class="flacon"><div class="etiq"></div><div class="reflet"></div></div></div>
<script>const h=190,w=h*2365/1089,cx=26.1/100.1*w;document.querySelector('.etiq').style.setProperty('--x',(115-cx)+'px');</script></body></html>
