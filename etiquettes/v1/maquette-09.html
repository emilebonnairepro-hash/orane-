<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#FFF3E3;display:grid;place-items:center;height:100vh}
.scene{position:relative;width:560px;height:520px}
.couvercle{position:absolute;left:50%;top:70px;width:400px;height:90px;transform:translateX(-50%);background:linear-gradient(90deg,#ddd,#fafafa 45%,#d6d6d6);border:3px solid #2A1240;border-radius:18px 18px 8px 8px}
.pot{position:absolute;left:50%;top:156px;width:380px;height:250px;transform:translateX(-50%);background:#f2f2f2;border:3px solid #2A1240;border-radius:10px 10px 30px 30px;overflow:hidden;box-shadow:12px 12px 0 #2A1240}
.etiq{position:absolute;left:0;right:0;top:30px;height:180px;background-image:url(sortie/09-masque-argile/etiquette.png);background-size:auto 180px;background-position:var(--x) 0}
.reflet{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.2),rgba(255,255,255,0) 25%,rgba(255,255,255,.3) 50%,rgba(0,0,0,.22))}
</style></head><body><div class="scene"><div class="couvercle"></div><div class="pot"><div class="etiq"></div><div class="reflet"></div></div></div>
<script>const h=180,w=h*5892/1083,cx=124.8/249.5*w;document.querySelector('.etiq').style.setProperty('--x',(190-cx)+'px');</script></body></html>
