<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Unbounded:wght@700;800;900&display=block" rel="stylesheet">
<style>
@page { size: 66mm 96mm; margin: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 66mm; height: 96mm; overflow: hidden; background: transparent; }
body { position: relative; color: #2A1240; font-family: "Bricolage Grotesque", sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; --f: 1; }
.fond { position: absolute; left: 0.0mm; top: 0.0mm; width: 66.0mm; height: 71.0mm; background: #FF6A2B; }
.trou { position: absolute; background: #fff; border-radius: 2mm; }
.slogan { position: absolute; transform: translate(-50%, -50%) rotate(-90deg); white-space: nowrap; font-family: Unbounded, sans-serif; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }

/* ----- face avant ----- */
.front { position: absolute; left: 6mm; top: 6mm; width: 54mm; height: 62mm; display: flex; flex-direction: column; }
.head { display: flex; align-items: center; gap: 1.21mm; padding-bottom: 0.91mm; border-bottom: 0.34mm solid currentColor; }
.mark { flex: 0 0 40%; width: 40%; min-width: 0; overflow: hidden; font-family: Unbounded, sans-serif; font-weight: 900; letter-spacing: -.055em; line-height: .82; white-space: nowrap; }
.head .bouille { width: 6.43mm; flex: none; transform: rotate(8deg); }
.kick { flex: 1; min-width: 0; text-align: right; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 5.00pt; letter-spacing: .12em; text-transform: uppercase; line-height: 1.3; }
.kick b { display: block; font-weight: 900; font-size: 6.43pt; letter-spacing: -.02em; }
.name { display: flex; flex-direction: column; margin-top: 1.51mm; }
.ln { display: block; width: 100%; white-space: nowrap; font-family: Unbounded, sans-serif; font-weight: 900; line-height: .92; letter-spacing: -.045em; }
.ln.em { color: #D4F23A; -webkit-text-stroke: 0.34mm #2A1240; paint-order: stroke fill; }
.sous { font-weight: 800; font-size: calc(5.14pt * min(var(--f), 1.25)); line-height: 1.2; margin-top: 0.91mm; }

.fiche { flex: 1; display: flex; flex-direction: column; justify-content: space-between; margin-top: 1.81mm; min-height: 0; }
.row { border-top: 0.23mm solid currentColor; padding-top: calc(0.68mm * var(--f)); }
.row:first-child { border-top: 0; padding-top: 0; }
.lab { font-family: Unbounded, sans-serif; font-weight: 700; font-size: calc(4.60pt * var(--f)); letter-spacing: .14em; text-transform: uppercase; opacity: .8; }
.val { font-weight: 800; font-size: calc(5.20pt * var(--f)); line-height: 1.18; margin-top: calc(.4mm * var(--f)); }
.row.hl { border: 0; background: #2A1240; color: #FFF3E3; border-radius: 1.66mm; padding: calc(0.91mm * var(--f)) calc(1.51mm * var(--f)); }
.row.hl + .row { border-top: 0; }
.row.hl .lab { opacity: .85; }
.row.hl .val { font-family: Unbounded, sans-serif; font-weight: 800; letter-spacing: -.01em; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 2mm; border-top: 0.34mm solid currentColor; padding-top: 0.91mm; margin-top: 1.06mm; }
.foot b { font-family: Unbounded, sans-serif; font-weight: 900; font-size: 6.80pt; white-space: nowrap; }
.minis { display: flex; flex-wrap: wrap; gap: 1mm; }
.mini { border: 0.26mm solid currentColor; border-radius: 99mm; padding: .3mm 1.6mm; font-weight: 800; font-size: 5.00pt; white-space: nowrap; }
.claim { overflow-wrap: normal; width: 100%; font-family: Unbounded, sans-serif; font-weight: 800; font-size: calc(6.80pt * var(--f)); line-height: 1.08; letter-spacing: -.02em; }
.pour { width: 100%; font-weight: 800; font-size: calc(5.50pt * var(--f)); line-height: 1.2; border-top: 0.23mm solid currentColor; padding-top: calc(0.76mm * var(--f)); }
.slog { white-space: nowrap; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 4.60pt; letter-spacing: .1em; text-transform: uppercase; }

/* ----- côté ----- */
.side { position: absolute; display: flex; flex-direction: column; justify-content: space-between; }
.side section { border-top: .3mm solid currentColor; padding-top: 1.6mm; }
.side section:first-child { border-top: 0; padding-top: 0; }
.ct { font-family: Unbounded, sans-serif; font-weight: 800; font-size: 8pt; margin-bottom: 1.4mm; }
.steps { list-style: none; display: grid; gap: 1.2mm; }
.steps li { display: grid; grid-template-columns: 7mm 1fr; align-items: center; gap: 1.6mm; font-weight: 700; font-size: 6.8pt; line-height: 1.2; }
.steps b { font-family: Unbounded, sans-serif; font-weight: 900; font-size: 16pt; line-height: .8; color: #D4F23A; -webkit-text-stroke: .3mm #2A1240; paint-order: stroke fill; text-align: center; }
.plus { list-style: none; display: grid; gap: .8mm; }
.plus li { font-weight: 800; font-size: 6.8pt; }
.plus li::before { content: "✦ "; color: #D4F23A; -webkit-text-stroke: .15mm #2A1240; }
.txt { font-weight: 700; font-size: 6.8pt; line-height: 1.3; }
.badges { display: flex; align-items: center; gap: 2.6mm; }
.badge { width: 15mm; height: 15mm; flex: none; border-radius: 50%; background: #FFF3E3; color: #2A1240; border: .5mm solid #2A1240;
  display: grid; place-items: center; text-align: center; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 8pt; line-height: 1; }
.badge small { display: block; font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 5pt; margin-top: .5mm; }
.logo { width: 12mm; height: 12mm; background: #fff; border-radius: 50%; flex: none; }

.gl { position: absolute; pointer-events: none; }
.gz { position: absolute; border: .6mm dashed #FF6A2B; background: repeating-linear-gradient(45deg, rgba(255,106,43,.14) 0 2mm, transparent 2mm 4mm); display: grid; place-items: center; }
.gz span, .gt { font: 700 5pt sans-serif; color: #c2410c; background: rgba(255,255,255,.9); padding: .4mm 1mm; text-align: center; }
.gt { position: absolute; left: 4mm; bottom: .2mm; }
</style></head><body>
<div class="fond"></div>


<div class="front">
  <div class="head"><p class="mark" data-fit data-max="19.7">orane</p><svg viewBox="0 0 120 120" class="bouille"><circle cx="64" cy="64" r="52" fill="#2A1240"/>
<circle cx="58" cy="58" r="52" fill="#FF6A2B" stroke="#2A1240" stroke-width="5"/>
<ellipse cx="30" cy="70" rx="10" ry="7" fill="#FF5FA8"/><ellipse cx="86" cy="70" rx="10" ry="7" fill="#FF5FA8"/>
<circle cx="42" cy="48" r="7" fill="#2A1240"/>
<path d="M68 48 Q76 40 84 48" fill="none" stroke="#2A1240" stroke-width="5" stroke-linecap="round"/>
<path d="M36 66 Q58 98 82 66 Z" fill="#2A1240" stroke="#2A1240" stroke-width="4" stroke-linejoin="round"/>
<path d="M48 80 Q58 72 70 80 Q60 90 48 80 Z" fill="#FF5FA8"/></svg><p class="kick"><b>n°02</b>cheveux</p></div>
  <div class="name"><span class="ln" data-fit data-max="30.2">shampooing</span></div>
  
  <div class="fiche"><p class="claim">Lave en douceur, cuir chevelu confortable.</p><p class="pour">pour cuirs chevelus sensibles ou facilement irrités</p></div>
  <div class="foot"><div class="minis"></div><b></b></div>
</div>


<script>
function fit(el, max) {
  let lo = 4, hi = max;
  for (let i = 0; i < 18; i++) { const mid = (lo + hi) / 2; el.style.fontSize = mid + 'pt'; if (el.scrollWidth > el.clientWidth + .5) hi = mid; else lo = mid; }
  el.style.fontSize = lo + 'pt';
}
async function run() {
  await document.fonts.ready;
  const front = document.querySelector('.front'), fiche = document.querySelector('.fiche');
  const foot = document.querySelector('.foot');
  const over = () => front.scrollHeight > front.clientHeight + .5 || fiche.scrollHeight > fiche.clientHeight + .5
    || [...fiche.children].some((c) => c.scrollWidth > fiche.clientWidth + .5);
  // 1. le nom remplit la largeur, sans prendre plus de 36 % de la hauteur
  let k = 1;
  for (let i = 0; i < 16; i++) {
    document.querySelectorAll('[data-fit]').forEach((el) => fit(el, parseFloat(el.dataset.max) * (el.classList.contains('ln') ? k : 1)));
    if (document.querySelector('.name').getBoundingClientRect().height <= front.clientHeight * .36) break;
    k *= .93;
  }
  // 2. la fiche grandit jusqu'à remplir toute la hauteur restante (pas de vide)
  let lo = .6, hi = 2.4;
  for (let i = 0; i < 18; i++) { const mid = (lo + hi) / 2; document.body.style.setProperty('--f', mid); if (over()) hi = mid; else lo = mid; }
  document.body.style.setProperty('--f', lo);
  // 3. le côté remplit sa hauteur
  const side = document.querySelector('.side');
  if (side) {
    const H0 = side.clientHeight, W0 = side.clientWidth;
    const apply = (z) => { side.style.transformOrigin = '0 0'; side.style.transform = `scale(${z})`; side.style.width = (W0 / z) + 'px'; side.style.height = (H0 / z) + 'px'; };
    const need = () => [...side.children].reduce((a, c) => a + c.scrollHeight, 0) + 6 * 4;
    let a = .6, b = 1.5;
    for (let i = 0; i < 16; i++) { const mid = (a + b) / 2; apply(mid); if (need() > side.clientHeight) b = mid; else a = mid; }
    apply(a);
  }
  document.body.dataset.ready = '1';
}
run();
</script>
</body></html>
