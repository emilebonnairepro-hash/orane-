<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Unbounded:wght@700;800;900&display=block" rel="stylesheet">
<style>
@page { size: 66mm 96mm; margin: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 66mm; height: 96mm; overflow: hidden; background: transparent; }
body { position: relative; color: #2A1240; font-family: "Bricolage Grotesque", sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.fond { position: absolute; left: 0.0mm; top: 0.0mm; width: 66.0mm; height: 71.0mm; background: #FF6A2B; overflow: hidden; }
.trou { position: absolute; background: #fff; border-radius: 2mm; }
.sp { position: absolute; }
.slogan { position: absolute; transform: translate(-50%, -50%) rotate(-90deg); white-space: nowrap; font-family: Unbounded, sans-serif; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }

/* ----- face avant ----- */
.front { position: absolute; left: 6mm; top: 6mm; width: 54mm; height: 62mm; display: flex; flex-direction: column; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 1.51mm; padding-bottom: 0.91mm; border-bottom: 0.34mm solid currentColor; }
.mark { flex: 0 0 60%; width: 60%; min-width: 0; overflow: hidden; font-family: Unbounded, sans-serif; font-weight: 900; letter-spacing: -.055em; line-height: .82; white-space: nowrap; }
.kick { flex: 1; min-width: 0; text-align: right; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 5.00pt; letter-spacing: .14em; text-transform: uppercase; line-height: 1.35; }
.kick b { display: block; font-weight: 900; font-size: 6.80pt; letter-spacing: -.02em; }
.name { display: flex; flex-direction: column; margin-top: 1.66mm; }
.ln { display: block; width: 100%; white-space: nowrap; font-family: Unbounded, sans-serif; font-weight: 900; line-height: .92; letter-spacing: -.045em; }
.ln.em { color: #D4F23A; -webkit-text-stroke: 0.38mm #2A1240; paint-order: stroke fill; }
.sous { font-weight: 800; font-size: 5.14pt; line-height: 1.2; margin-top: 0.91mm; }

.win { position: relative; flex: 1; min-height: 16.63mm; margin-top: 1.97mm; container-type: size; display: flex; flex-direction: column; align-items: center; }
.win-bg { position: absolute; left: 0; right: 0; bottom: 0; top: calc(min(86cqw, 66cqh) * .42); background: #FFF3E3; color: #2A1240;
  border: 0.42mm solid #2A1240; border-radius: 3.78mm; box-shadow: 0.83mm 0.83mm 0 #2A1240; }
.halo { position: relative; flex: none; width: min(86cqw, 66cqh); aspect-ratio: 1; }
.halo svg.cercle { position: absolute; inset: 0; width: 100%; height: 100%; animation: none; }
.halo .bouille { position: absolute; width: 56%; left: 22%; top: 21%; transform: rotate(8deg); }
.halo .sp { width: 16%; right: -6%; top: 2%; }
.win-foot { position: relative; flex: 1; align-self: stretch; padding: 1.21mm 1.81mm 1.51mm; color: #2A1240; display: flex; flex-direction: column; justify-content: space-between; gap: 1.21mm; align-items: center; }
.pills { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.91mm; }
.pill { background: var(--bg); color: var(--fg); border: 0.34mm solid #2A1240; border-radius: 99mm; padding: 0.53mm 1.66mm;
  font-family: Unbounded, sans-serif; font-weight: 700; font-size: 5.00pt; white-space: nowrap; transform: rotate(var(--r)); box-shadow: 0.42mm 0.42mm 0 #2A1240; }
.acc { font-family: Unbounded, sans-serif; font-weight: 800; font-size: 5.00pt; line-height: 1.15; text-align: center; letter-spacing: -.01em; max-width: 92%; }
.vol { align-self: stretch; display: flex; justify-content: space-between; align-items: baseline; border-top: 0.23mm dashed #2A1240; padding-top: 0.76mm; }
.vol span { font-weight: 700; font-size: 5.00pt; }
.vol b { font-family: Unbounded, sans-serif; font-weight: 800; font-size: 5.00pt; white-space: nowrap; }

/* ----- côté ----- */
.side { position: absolute; display: flex; flex-direction: column; }
.side-in { display: flex; flex-direction: column; gap: 2.2mm; }
.ct { font-family: Unbounded, sans-serif; font-weight: 800; font-size: 8pt; letter-spacing: -.01em; margin-bottom: 1.6mm; }
.steps { list-style: none; display: grid; gap: 1.4mm; }
.steps li { display: grid; grid-template-columns: 7mm 1fr; align-items: center; gap: 1.6mm; font-weight: 700; font-size: 6.6pt; line-height: 1.2; }
.steps b { font-family: Unbounded, sans-serif; font-weight: 900; font-size: 17pt; line-height: .8; color: transparent; -webkit-text-stroke: .35mm #2A1240; text-align: center; }
.steps li:nth-child(2) b { color: #D4F23A; -webkit-text-stroke: .35mm #2A1240; paint-order: stroke fill; }
.chips { display: flex; flex-wrap: wrap; gap: 1.2mm; }
.chip { border: .4mm solid currentColor; border-radius: 99mm; padding: .5mm 2mm; font-weight: 700; font-size: 6.4pt; }
.note { font-weight: 600; font-size: 6.2pt; margin-top: 1.4mm; }
.txt { font-weight: 600; font-size: 6.6pt; line-height: 1.32; }
.sep { display: flex; align-items: center; gap: 2mm; }
.sep::before, .sep::after { content: ""; flex: 1; border-top: .3mm solid currentColor; opacity: .5; }
.sepsp { width: 3.6mm; height: 3.6mm; flex: none; }
.badges { display: flex; align-items: center; gap: 2.6mm; margin-top: auto; padding-top: 2mm; }
.badge { width: 15mm; height: 15mm; flex: none; border-radius: 50%; background: #FFF3E3; color: #2A1240; border: .5mm solid #2A1240; box-shadow: .8mm .8mm 0 #2A1240;
  display: grid; place-items: center; text-align: center; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 8pt; line-height: 1; transform: rotate(8deg); }
.badge small { display: block; font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 5pt; margin-top: .5mm; }
.logo { width: 12mm; height: 12mm; background: #fff; border-radius: 50%; flex: none; }

/* ----- repères (aperçu seulement) ----- */
.gl { position: absolute; pointer-events: none; }
.gz { position: absolute; border: .6mm dashed #FF6A2B; background: repeating-linear-gradient(45deg, rgba(255,106,43,.14) 0 2mm, transparent 2mm 4mm); display: grid; place-items: center; }
.gz span, .gt { font: 700 5pt sans-serif; color: #c2410c; background: rgba(255,255,255,.9); padding: .4mm 1mm; text-align: center; }
.gt { position: absolute; left: 4mm; bottom: .2mm; }
</style></head><body>
<div class="fond"></div>


<div class="front">
  <div class="head"><p class="mark" data-fit data-max="22.7">orane</p><p class="kick"><b>n°05</b>homme</p></div>
  <div class="name"><span class="ln" data-fit data-max="30.2">gel</span><span class="ln em" data-fit data-max="30.2">visage</span></div>
  <p class="sous">au zinc · sans huile</p>
  <div class="win">
    <div class="win-bg"></div>
    <div class="halo">
      <svg class="cercle" viewBox="0 0 200 200">
        <defs><path id="c" d="M100 100 m-76 0 a76 76 0 1 1 152 0 a76 76 0 1 1 -152 0"/></defs>
        <circle cx="100" cy="100" r="97" fill="#6B2CF5" stroke="#2A1240" stroke-width="4"/>
        <circle cx="100" cy="100" r="60" fill="#FFF3E3" stroke="#2A1240" stroke-width="3"/>
        <text font-family="Unbounded, sans-serif" font-weight="800" font-size="15.5" letter-spacing="1.2" fill="#FFF3E3"><textPath href="#c" textLength="470" lengthAdjust="spacingAndGlyphs">frais et net ✦ zéro effet gras ✦ peau neuve, mine de rien ✦ </textPath></text>
      </svg>
      <svg viewBox="0 0 120 120" class="bouille"><circle cx="64" cy="64" r="52" fill="#2A1240"/>
<circle cx="58" cy="58" r="52" fill="#FF6A2B" stroke="#2A1240" stroke-width="5"/>
<ellipse cx="30" cy="70" rx="10" ry="7" fill="#FF5FA8"/><ellipse cx="86" cy="70" rx="10" ry="7" fill="#FF5FA8"/>
<circle cx="42" cy="48" r="7" fill="#2A1240"/>
<path d="M68 48 Q76 40 84 48" fill="none" stroke="#2A1240" stroke-width="5" stroke-linecap="round"/>
<path d="M36 66 Q58 98 82 66 Z" fill="#2A1240" stroke="#2A1240" stroke-width="4" stroke-linejoin="round"/>
<path d="M48 80 Q58 72 70 80 Q60 90 48 80 Z" fill="#FF5FA8"/></svg>
      <svg viewBox="0 0 40 40" class="sp "><path d="M20 2 C22 14 26 18 38 20 C26 22 22 26 20 38 C18 26 14 22 2 20 C14 18 18 14 20 2 Z" fill="#D4F23A" stroke="#2A1240" stroke-width="2.5" stroke-linejoin="round"/></svg>
    </div>
    <div class="win-foot">
      <div class="pills"><span class="pill" style="--bg:#D4F23A;--fg:#2A1240;--r:-5deg">au zinc</span><span class="pill" style="--bg:#FFF3E3;--fg:#2A1240;--r:4deg">sans huile</span></div>
      <p class="acc">Hydratation express, zéro effet brillant.</p>
      <div class="vol"><span>hydratant</span><b></b></div>
    </div>
  </div>
</div>

<div class="gl" style="inset:3mm;border:.3mm solid #2a6cff"></div><div class="gl" style="inset:6mm;border:.25mm dashed #2a6cff;opacity:.6"></div><div class="gl" style="left:6mm;width:54mm;top:0;bottom:0;border-inline:.3mm dashed #777"></div><div class="gz" style="left:0mm;top:72mm;width:66mm;height:24mm"><span>mentions obligatoires<br>(Selfnamed)</span></div><p class="gt">bleu : coupe · pointillés : marge · gris : face avant · orange : laissé vide</p>
<script>
function fit(el, max) {
  let lo = 4, hi = max;
  for (let i = 0; i < 18; i++) { const mid = (lo + hi) / 2; el.style.fontSize = mid + 'pt'; if (el.scrollWidth > el.clientWidth + .5) hi = mid; else lo = mid; }
  el.style.fontSize = lo + 'pt';
}
async function run() {
  await document.fonts.ready;
  const front = document.querySelector('.front'), win = document.querySelector('.win');
  let k = 1;
  for (let pass = 0; pass < 14; pass++) {
    document.querySelectorAll('[data-fit]').forEach((el) => fit(el, parseFloat(el.dataset.max) * (el.classList.contains('ln') ? k : 1)));
    const over = () => front.scrollHeight > front.clientHeight + .5 || win.scrollHeight > win.clientHeight + .5;
    if (!over() && win.getBoundingClientRect().height >= front.clientHeight * .34) break;
    // petits formats : on retire d'abord l'accroche, puis la 2e pastille, et seulement ensuite on réduit le nom
    const acc = document.querySelector('.acc'), pill2 = document.querySelectorAll('.pill')[1];
    if (acc && acc.style.display !== 'none') { acc.style.display = 'none'; continue; }
    if (pill2 && pill2.style.display !== 'none') { pill2.style.display = 'none'; continue; }
    k *= .92;
  }
  const side = document.querySelector('.side');
  if (side) {
    const H0 = side.clientHeight, W0 = side.clientWidth;
    const apply = (z) => { side.style.transformOrigin = '0 0'; side.style.transform = `scale(${z})`; side.style.width = (W0 / z) + 'px'; side.style.height = (H0 / z) + 'px'; };
    const inner = () => side.querySelector('.side-in').scrollHeight + (side.querySelector('.badges')?.scrollHeight || 0) + 8;
    let lo = .6, hi = 1.3;
    for (let i = 0; i < 16; i++) { const mid = (lo + hi) / 2; apply(mid); if (inner() > side.clientHeight) hi = mid; else lo = mid; }
    apply(lo * .97);
  }
  document.body.dataset.ready = '1';
}
run();
</script>
</body></html>
